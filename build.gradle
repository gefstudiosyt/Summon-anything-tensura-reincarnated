plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = '1.7.1'
group = 'dev.summonanything'
base { archivesName = 'summon-anything' }

repositories {
    // Nothing extra needed: this mod does NOT compile against Tensura.
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    // Needed for the creative tab, menu screen and networking. Same version as in your game.
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.12+1.21.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
